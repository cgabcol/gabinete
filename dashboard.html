    <style>
        #sistemasCadastrados {
            width: 100%;
            height: 410px;

        .sistema {
            margin: 5px;
            float: left;
            display: flex;
            justify-content: center;
            align-items: center;
            width: 120px;
            height: 60px;
            background-color: #9e180c;
            color: var(--branco);
            text-decoration: none;
            border-radius: 10px;
            box-shadow: rgba(0, 0, 0, 0.35) 0px 5px 15px;
            font-size: 18px;
        }

        .sistema i {
            margin-right: 5px;
        }

        .sistema:hover {
            opacity: 0.9;
        }

        .acoes {
            box-shadow: rgba(0, 0, 0, 0.35) 0px 5px 15px;
            padding: 10px;
            border-radius: 5px;
            display: flex;
            justify-content: center;
        }

        .acoes button {
            width: 150px;
            padding: 5px;
            background-color: var(--verde);
            color: var(--branco);
            border-radius: 5px;
            border: none;
            cursor: pointer;
        }

        .acoes button:hover {
            background-color: var(--verde-escuro);
        }
    </style>
